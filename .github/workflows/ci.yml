name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  server:
    name: Server — lint, unit & security tests, audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      # Placeholder secrets so modules that hard-fail on missing config can boot in CI.
      # No real database or Redis is provisioned here — DB/Redis-integration suites are
      # intentionally NOT run in this job (see comment on the `test` step below).
      JWT_SECRET: ci-placeholder-jwt-secret-at-least-32-characters-long
      FIELD_ENCRYPTION_KEY: ci-placeholder-32-char-encryption-key
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_placeholder
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Unit tests (mocked Prisma/Redis — no live DB)
        run: npm run test:unit

      - name: Security & cryptographic test suite
        run: npm run test:security

      # test:integration is intentionally excluded here: several of its suites import
      # the real Prisma client without mocking, and this repo's own .env is wired to a
      # live Neon database rather than an isolated CI/test instance. Re-enable this once
      # a dedicated ephemeral test database (service container or Neon branch) is wired
      # into this job via DATABASE_URL.

      - name: Dependency audit (high+ severity, with documented exception)
        # GHSA-ggr8-5vv4-36mx (deepmerge-ts, pulled in transitively by the `prisma` CLI's
        # @prisma/config) currently affects every Prisma 6.13+ release, including latest —
        # there is no non-breaking upgrade path yet. It's a dev/build-time CLI dependency
        # (only `prisma generate` on trusted, developer-authored schema.prisma; never
        # touches request input), so it's accepted and tracked, not silently ignored.
        # See SECURITY.md for the full rationale. Every other high/critical finding still
        # fails this job.
        run: |
          npm audit --audit-level=high --json > audit-report.json || true
          node -e "
            const report = require('./audit-report.json');
            // The one accepted chain: prisma (CLI) -> @prisma/config -> deepmerge-ts (GHSA-ggr8-5vv4-36mx).
            const allowedPackages = new Set(['deepmerge-ts', '@prisma/config', 'prisma']);
            const unexpected = Object.values(report.vulnerabilities || {})
              .filter(v => ['high', 'critical'].includes(v.severity))
              .filter(v => !allowedPackages.has(v.name));
            if (unexpected.length > 0) {
              console.error('Unexpected high/critical vulnerabilities found:', JSON.stringify(unexpected, null, 2));
              process.exit(1);
            }
            console.log('Only the documented, accepted exception(s) present — passing.');
          "

  client:
    name: Client — lint, unit tests, build, audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Dependency audit (high+ severity)
        run: npm audit --audit-level=high

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
